[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dgd-framework"
version = "0.1.0"
description = "Diagnostic-Guided Deliberation (DGD): Epistemic Entropy Steering for Large Language Model Reasoning"
readme = "README.md"
authors = [
    { name = "Jannat", email = "research@example.edu" }
]
license = { text = "MIT" }
keywords = ["llm", "test-time-compute", "reasoning", "epistemic-steering", "deliberation-trap", "ai-alignment"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "openai>=1.12.0",
    "google-genai>=0.1.1",
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "matplotlib>=3.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
